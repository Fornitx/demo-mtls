name: Java CI with Gradle

on:
  push:
    branches: [ main ]
    paths: ['**.kt', '**.kts', '**.yaml', '**.toml', '**.properties']
  pull_request:
    branches: [ main ]
    paths: ['**.kt', '**.kts', '**.yaml', '**.toml', '**.properties']
  workflow_dispatch:

jobs:
  test:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Gradle test
        run: >-
          gradle test
          --show-version
          --no-daemon
          --parallel
          --build-cache
          --configuration-cache
          --configuration-cache-problems=warn
#          --isolated-projects
